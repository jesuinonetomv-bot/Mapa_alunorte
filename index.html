<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mapa Alunorte</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    *{box-sizing:border-box} html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#eef2f3;color:#263238}
    #app{height:100%;display:flex;flex-direction:column}
    header{background:#344047;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 2px 10px #0002;z-index:1001}
    header .title{font-weight:800;font-size:18px;letter-spacing:.2px} header .sub{font-size:12px;opacity:.8;margin-top:2px}
    .badge{background:#43807a;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
    #main{flex:1;display:grid;grid-template-columns:330px 1fr;min-height:0}
    aside{background:#fff;padding:14px;border-right:1px solid #dce3e5;overflow:auto;z-index:500}
    #map{height:100%;width:100%}
    .card{border:1px solid #dfe6e8;border-radius:14px;padding:12px;margin-bottom:12px;background:#fff;box-shadow:0 2px 8px #0000000a}
    .card h3{font-size:13px;text-transform:uppercase;letter-spacing:.7px;margin:0 0 10px;color:#5f6b70}
    label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#536066}
    select,button{width:100%;border-radius:10px;border:1px solid #ccd6d9;padding:11px 12px;font-size:14px;background:#fff}
    button{cursor:pointer;font-weight:800;border:none;background:#43807a;color:#fff;margin-top:8px}
    button.secondary{background:#344047} button.ghost{background:#edf2f3;color:#344047;border:1px solid #d3dcdf}
    button:disabled{opacity:.55;cursor:not-allowed}
    .status{font-size:13px;line-height:1.45;padding:10px;border-radius:10px;background:#f2f6f6;color:#415056}
    .routeInfo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .metric{background:#f5f7f8;padding:10px;border-radius:10px;text-align:center}.metric b{display:block;font-size:18px}.metric span{font-size:11px;color:#66757b}
    .legend{font-size:12px;line-height:1.8}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:7px}
    .road-label{background:#fff;border:1px solid #b8c2c5;border-radius:6px;padding:2px 5px;font-size:11px;font-weight:700;box-shadow:0 1px 4px #0002}
    .leaflet-popup-content{margin:10px 12px}
    .poi-icon{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 5px #0005}
    .poi-icon span{transform:rotate(45deg);font-size:13px}
    @media (max-width:800px){#main{display:block;position:relative} aside{position:absolute;left:10px;right:10px;bottom:10px;max-height:44%;border:0;border-radius:16px;box-shadow:0 8px 24px #0004;z-index:1000;padding:10px} #map{position:absolute;inset:0} header{padding:10px 12px}.card{margin-bottom:8px}.mobile-hide{display:none}}
  </style>
</head>
<body>
<div id="app">
  <header>
    <div><div class="title">Mapa Alunorte</div><div class="sub">Navegação interna pela malha mapeada</div></div>
    <div class="badge">Protótipo v0.3</div>
  </header>
  <div id="main">
    <aside>
      <div class="card">
        <h3>Navegação</h3>
        <label for="destino">Destino</label>
        <select id="destino"><option value="">Selecione um local...</option></select>
        <button id="btnLocalizar">📍 Usar minha localização</button>
        <button id="btnRota" class="secondary" disabled>➜ Calcular rota</button>
        <button id="btnLimpar" class="ghost">Limpar rota</button>
        <div class="routeInfo" id="routeInfo" style="display:none">
          <div class="metric"><b id="distancia">--</b><span>distância pela via</span></div>
          <div class="metric"><b id="tempo">--</b><span>tempo estimado a pé</span></div>
        </div>
      </div>
      <div class="card">
        <h3>Status</h3>
        <div id="status" class="status">Escolha um destino e permita o acesso à sua localização.</div>
      </div>
      <div class="card mobile-hide">
        <h3>Como funciona</h3>
        <div class="legend">
          <div><span class="dot" style="background:#344047"></span>Rua criada a partir do GPX</div>
          <div><span class="dot" style="background:#1976d2"></span>Sua localização</div>
          <div><span class="dot" style="background:#e53935"></span>Destino</div>
          <div><span class="dot" style="background:#ff8f00"></span>Rota calculada</div>
        </div>
      </div>
    </aside>
    <div id="map"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const rawTrack = [[-1.5528436, -48.7322755], [-1.5522112, -48.7321207], [-1.5516658, -48.7317553], [-1.551377, -48.7315242], [-1.5512773, -48.731445], [-1.5509593, -48.7312885], [-1.5503169, -48.730921], [-1.5496476, -48.7305208], [-1.549159, -48.7303004], [-1.5489402, -48.7304155], [-1.5488709, -48.7304786], [-1.5487732, -48.7304561], [-1.5486755, -48.7304725], [-1.5486183, -48.730545], [-1.5485431, -48.7306004], [-1.5484992, -48.7306845], [-1.5489285, -48.7304724], [-1.5488507, -48.7305243], [-1.5487272, -48.7305947], [-1.5485971, -48.7307052], [-1.5484724, -48.7308349], [-1.5484587, -48.7309265], [-1.5483701, -48.7309844], [-1.5482774, -48.7310197], [-1.5482092, -48.7310795], [-1.5481436, -48.7312141], [-1.5480734, -48.7313186], [-1.5479889, -48.7313763], [-1.5479201, -48.7314389], [-1.5478953, -48.731558], [-1.5478818, -48.7316752], [-1.5477648, -48.7318596], [-1.5476907, -48.7319628], [-1.5476172, -48.7320412], [-1.5475487, -48.7321154], [-1.547491, -48.7322411], [-1.5473801, -48.7323322], [-1.5473217, -48.7324084], [-1.5472305, -48.732408], [-1.5471513, -48.7323594], [-1.5469804, -48.7323346], [-1.5469104, -48.7323977], [-1.546853, -48.7324748], [-1.5467555, -48.7324577], [-1.5466414, -48.7324188], [-1.5465665, -48.7324722], [-1.5465004, -48.7325698], [-1.546458, -48.7326849], [-1.5463835, -48.7327755], [-1.5462869, -48.7327734], [-1.5462028, -48.7327018], [-1.5461075, -48.7326597], [-1.5460155, -48.7325943], [-1.5459064, -48.7325201], [-1.5458089, -48.7324677], [-1.5457346, -48.7323936], [-1.5456516, -48.7323533], [-1.545554, -48.7322949], [-1.5454494, -48.7323392], [-1.5453732, -48.7324526], [-1.5453268, -48.7325732], [-1.545277, -48.7326557], [-1.5452257, -48.7327341], [-1.5451699, -48.7328092], [-1.5451081, -48.7328811], [-1.5450212, -48.7329323], [-1.5449748, -48.7330261], [-1.5449253, -48.7331266], [-1.5448615, -48.7332262], [-1.5448102, -48.7333253], [-1.544738, -48.7333864], [-1.5446114, -48.7333543], [-1.5444933, -48.7333015], [-1.5443678, -48.7332541], [-1.5442606, -48.7331899], [-1.5441503, -48.733153], [-1.5440521, -48.7330809], [-1.5439547, -48.7330352], [-1.5438575, -48.7329625], [-1.5437748, -48.7328911], [-1.5437054, -48.7328219], [-1.5435775, -48.7327814], [-1.5434743, -48.7327661], [-1.5434003, -48.7327106], [-1.5433204, -48.7326654], [-1.5432386, -48.7327092], [-1.5431847, -48.7327859]];
const waypoints = [{"name": "Chapeira", "lat": -1.5486357, "lon": -48.7304949}, {"name": "Entrada da Alunorte", "lat": -1.5523812, "lon": -48.7322256}, {"name": "Entrada sala dos TGs", "lat": -1.5431767, "lon": -48.7327874}, {"name": "Prédio da diretoria", "lat": -1.5467972, "lon": -48.7324739}, {"name": "Restaurante central", "lat": -1.5484588, "lon": -48.7309118}, {"name": "Subestação SE-02A-1", "lat": -1.5451082, "lon": -48.7328795}, {"name": "Subestação SE-14B-1", "lat": -1.5462975, "lon": -48.7327696}, {"name": "Subestação SE-56C-1 geradores", "lat": -1.544758, "lon": -48.7333851}, {"name": "Subestação SSe-02C-1", "lat": -1.5435816, "lon": -48.7327834}, {"name": "Vestiário", "lat": -1.5489323, "lon": -48.7304638}];

const map = L.map('map', {zoomControl:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:22, attribution:'&copy; OpenStreetMap'}).addTo(map);

const statusEl = document.getElementById('status');
const destinoEl = document.getElementById('destino');
const btnRota = document.getElementById('btnRota');
let userMarker=null, userPos=null, routeLayer=null, connectorStart=null, connectorEnd=null, destHighlight=null;

function hav(a,b){
  const R=6371000, p1=a[0]*Math.PI/180, p2=b[0]*Math.PI/180, dp=(b[0]-a[0])*Math.PI/180, dl=(b[1]-a[1])*Math.PI/180;
  const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2; return 2*R*Math.asin(Math.sqrt(x));
}

// Converte pontos do GPX em uma malha viária. Pontos muito próximos são fundidos,
// permitindo que cruzamentos de percursos futuros se tornem conexões reais.
const MERGE_METERS=7;
const nodes=[]; const trackNodeIds=[];
function findOrCreateNode(p){
  let best=-1,bestD=Infinity;
  for(let i=0;i<nodes.length;i++){const d=hav(p,nodes[i].p); if(d<bestD){bestD=d;best=i}}
  if(bestD<=MERGE_METERS) return best;
  nodes.push({p:[p[0],p[1]], edges:[]}); return nodes.length-1;
}
for(const p of rawTrack) trackNodeIds.push(findOrCreateNode(p));
for(let i=1;i<trackNodeIds.length;i++){
  const a=trackNodeIds[i-1], b=trackNodeIds[i]; if(a===b) continue;
  const w=hav(nodes[a].p,nodes[b].p);
  if(!nodes[a].edges.some(e=>e.to===b)) nodes[a].edges.push({to:b,w});
  if(!nodes[b].edges.some(e=>e.to===a)) nodes[b].edges.push({to:a,w});
}

// Desenha como rua, não como trilha GPS: duas camadas simulam uma via.
const roadCoords=[];
for(let i=0;i<trackNodeIds.length;i++){
  const p=nodes[trackNodeIds[i]].p;
  if(!roadCoords.length || hav(roadCoords[roadCoords.length-1],p)>1) roadCoords.push(p);
}
L.polyline(roadCoords,{color:'#566267',weight:10,opacity:.92,lineCap:'round',lineJoin:'round'}).addTo(map);
L.polyline(roadCoords,{color:'#f3f5f5',weight:6,opacity:1,lineCap:'round',lineJoin:'round'}).addTo(map);

function poiCategory(name){
  const n=name.toLowerCase();
  if(n.includes('subestação')||n.includes('subestacao')) return ['⚡','#b95946'];
  if(n.includes('restaurante')) return ['🍴','#8a6b3f'];
  if(n.includes('entrada')) return ['↪','#43807a'];
  if(n.includes('vestiário')||n.includes('vestiario')) return ['👕','#66757b'];
  if(n.includes('diretoria')) return ['🏢','#4a3041'];
  return ['●','#768692'];
}
function makeIcon(name){const [ico,c]=poiCategory(name);return L.divIcon({className:'',html:`<div class="poi-icon" style="background:${c}"><span>${ico}</span></div>`,iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-28]});}
waypoints.forEach((w,i)=>{
  const m=L.marker([w.lat,w.lon],{icon:makeIcon(w.name)}).addTo(map).bindPopup(`<b>${w.name}</b><br><small>Ponto mapeado</small>`);
  w.marker=m;
  const op=document.createElement('option'); op.value=i; op.textContent=w.name; destinoEl.appendChild(op);
});

const bounds=L.latLngBounds(roadCoords);
waypoints.forEach(w=>bounds.extend([w.lat,w.lon]));
map.fitBounds(bounds.pad(.12));

function nearestNode(p){let best=0,bd=Infinity; for(let i=0;i<nodes.length;i++){const d=hav(p,nodes[i].p);if(d<bd){bd=d;best=i}} return {id:best,d:bd};}
function dijkstra(start,goal){
  const dist=Array(nodes.length).fill(Infinity), prev=Array(nodes.length).fill(-1), used=Array(nodes.length).fill(false); dist[start]=0;
  for(let k=0;k<nodes.length;k++){
    let u=-1,bd=Infinity; for(let i=0;i<nodes.length;i++) if(!used[i]&&dist[i]<bd){bd=dist[i];u=i}
    if(u<0||u===goal) break; used[u]=true;
    for(const e of nodes[u].edges){const nd=dist[u]+e.w;if(nd<dist[e.to]){dist[e.to]=nd;prev[e.to]=u}}
  }
  if(!isFinite(dist[goal])) return null;
  const path=[]; for(let u=goal;u!==-1;u=prev[u]) path.push(u); path.reverse(); return {path,dist:dist[goal]};
}
function clearRoute(){
  [routeLayer,connectorStart,connectorEnd,destHighlight].forEach(x=>{if(x)map.removeLayer(x)});
  routeLayer=connectorStart=connectorEnd=destHighlight=null; document.getElementById('routeInfo').style.display='none';
}
document.getElementById('btnLimpar').onclick=()=>{clearRoute(); statusEl.textContent='Rota removida. Sua localização continua disponível.'};

function updateRouteButton(){btnRota.disabled=!(userPos && destinoEl.value!=='');}
destinoEl.onchange=()=>{
  updateRouteButton(); clearRoute();
  if(destinoEl.value!==''){const w=waypoints[+destinoEl.value]; map.flyTo([w.lat,w.lon],19); w.marker.openPopup(); statusEl.textContent=`Destino selecionado: ${w.name}.`}
};

function setUserPosition(lat,lon,accuracy){
  userPos=[lat,lon];
  if(userMarker) map.removeLayer(userMarker);
  userMarker=L.circleMarker(userPos,{radius:9,color:'#fff',weight:3,fillColor:'#1976d2',fillOpacity:1}).addTo(map).bindPopup(`Você está aqui${accuracy?`<br><small>Precisão aproximada: ${Math.round(accuracy)} m</small>`:''}`);
  const near=nearestNode(userPos);
  statusEl.innerHTML=`Localização encontrada. Você está a aproximadamente <b>${Math.round(near.d)} m</b> da rua mapeada mais próxima.`;
  map.setView(userPos,19); updateRouteButton();
}
function locate(){
  if(!navigator.geolocation){statusEl.textContent='Este navegador não oferece geolocalização.';return}
  statusEl.textContent='Buscando sua localização...';
  navigator.geolocation.getCurrentPosition(
    p=>setUserPosition(p.coords.latitude,p.coords.longitude,p.coords.accuracy),
    e=>{statusEl.textContent='Não foi possível obter sua localização. Verifique a permissão de localização do navegador.'},
    {enableHighAccuracy:true,timeout:15000,maximumAge:3000}
  );
}
document.getElementById('btnLocalizar').onclick=locate;

btnRota.onclick=()=>{
  if(!userPos||destinoEl.value==='') return;
  clearRoute();
  const w=waypoints[+destinoEl.value], start=nearestNode(userPos), end=nearestNode([w.lat,w.lon]);
  const result=dijkstra(start.id,end.id);
  if(!result){statusEl.textContent='Não existe conexão entre sua posição e esse destino na malha mapeada.';return}
  const coords=result.path.map(id=>nodes[id].p);
  routeLayer=L.polyline(coords,{color:'#ff8f00',weight:7,opacity:.95,lineCap:'round',lineJoin:'round'}).addTo(map);
  connectorStart=L.polyline([userPos,nodes[start.id].p],{color:'#1976d2',weight:3,dashArray:'6 7',opacity:.8}).addTo(map);
  connectorEnd=L.polyline([nodes[end.id].p,[w.lat,w.lon]],{color:'#e53935',weight:3,dashArray:'6 7',opacity:.8}).addTo(map);
  destHighlight=L.circleMarker([w.lat,w.lon],{radius:13,color:'#e53935',weight:3,fillOpacity:0}).addTo(map);
  const total=result.dist+start.d+end.d;
  document.getElementById('distancia').textContent=total<1000?`${Math.round(total)} m`:`${(total/1000).toFixed(2)} km`;
  const mins=Math.max(1,Math.ceil(total/80)); document.getElementById('tempo').textContent=`${mins} min`;
  document.getElementById('routeInfo').style.display='grid';
  statusEl.innerHTML=`Rota para <b>${w.name}</b> calculada pelas ruas já mapeadas.`;
  const rb=L.latLngBounds([userPos,[w.lat,w.lon],...coords]); map.fitBounds(rb.pad(.18));
};

// Em HTTPS (GitHub Pages), tenta obter a posição ao abrir. O navegador sempre decide se pede autorização.
setTimeout(()=>{ if(location.protocol==='https:') locate(); },700);
</script>
</body>
</html>
